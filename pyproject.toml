[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pne-scheduler"
version = "0.1.0"
description = "PNE cycler .sch schedule builder, viewer, and resume tools for ASSB lab protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hwiho Kim", email = "hwiho@hotmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pne-scheduler = "pne_scheduler.__main__:main"

[tool.setuptools]
packages = [
    "pne_scheduler",
    "pne_scheduler.classify",
    "pne_scheduler.edit",
    "pne_scheduler.engine",
    "pne_scheduler.io",
    "pne_scheduler.ir",
    "pne_scheduler.modules",
    "pne_scheduler.protocol",
    "pne_scheduler.resume",
    "pne_scheduler.schema",
    "pne_scheduler.stack",
    "pne_scheduler.tools",
    "pne_scheduler.ui",
    "pne_scheduler.validate",
]

[tool.setuptools.package-dir]
"pne_scheduler" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
