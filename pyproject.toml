[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pne-scheduler"
version = "0.1.0"
description = "PNE cycler .sch schedule builder, viewer, and resume tools for ASSB lab protocols"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Hwiho Kim", email = "hwiho@hotmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]
web = ["flask>=3.0"]
mdb = ["access_parser"]

[project.scripts]
pne-scheduler = "pne_scheduler.__main__:main"

[tool.setuptools]
packages = [
    "pne_scheduler",
    "pne_scheduler.api",
    "pne_scheduler.classify",
    "pne_scheduler.edit",
    "pne_scheduler.engine",
    "pne_scheduler.io",
    "pne_scheduler.ir",
    "pne_scheduler.modules",
    "pne_scheduler.protocol",
    "pne_scheduler.report",
    "pne_scheduler.resume",
    "pne_scheduler.schema",
    "pne_scheduler.spec",
    "pne_scheduler.stack",
    "pne_scheduler.tools",
    "pne_scheduler.ui",
    "pne_scheduler.validate",
    "pne_scheduler.vendor",
    "pne_scheduler.vendor.assb_sch",
]

[tool.setuptools.package-dir]
"pne_scheduler" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["vendor"]

[tool.ruff.lint]
# Deliberately minimal first pass: ruff's own default set (pyflakes F +
# pycodestyle E4/E7/E9) catches real bugs -- unused/undefined names, bare
# `except`, comparisons like `is None` on values that can never be None --
# without the noise of full style rules (line length, import sorting, etc).
# Broaden this only as a deliberate follow-up, not bundled in here.
select = ["E4", "E7", "E9", "F"]
# E402 (import not at top of file) fires on every run_pne_scheduler_*.py
# launcher and several tools/*.py scripts that deliberately sys.path.insert()
# before importing the local package pre-install -- a working, intentional
# pattern here, not a bug.
ignore = ["E402"]
