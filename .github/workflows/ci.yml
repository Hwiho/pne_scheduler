name: pne-scheduler-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # PySide6's offscreen platform plugin still links these, so without them
      # the Qt workspace tests would skip and the default UI would go untested.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,gui,web]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --tb=short
      # tests/test_workspace_qt.py skips itself on a missing PySide6, so a failed
      # install would hide the default UI's only coverage behind a green run.
      # That import is the sole skip condition, so asserting it closes the hole.
      - name: Assert the optional extras are installed (their tests must not skip)
        run: |
          python -c "import PySide6; print('PySide6', PySide6.__version__)"
          python -c "import flask; print('flask', flask.__version__)"
      - name: Corpus report smoke (in-repo zips)
        run: python tools/compare_pne_units.py
