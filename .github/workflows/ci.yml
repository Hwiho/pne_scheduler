name: pne-scheduler-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,web]"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest tests/ -q --tb=short
      # API tests must run, not silently skip because Flask was absent.
      - name: Assert Flask is installed (the API tests must not skip)
        run: python -c "import flask; print('flask', flask.__version__)"
      - name: Corpus report smoke (in-repo zips)
        run: python tools/compare_pne_units.py
  native:
    name: Native Tk (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PNE_REQUIRE_TK: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Native dependencies (no Flask or Node required)
        run: python -m pip install -e ".[dev]"
      - name: Cross-platform data locks, safe stop and restore (silent notifier)
        run: python -m pytest tests/test_companion_control.py tests/test_data_backup.py -q
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Native widget and parity tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest tests/test_native_controller.py tests/test_native_tk.py tests/test_native_protocol_dialogs.py tests/test_tk_tools.py -q
      - name: Native widget and parity tests (Windows)
        if: runner.os == 'Windows'
        # Two independent full runs, both required. Not a retry-on-failure.
        run: |
          1..2 | ForEach-Object {
            python -m pytest tests/test_native_controller.py tests/test_native_tk.py tests/test_native_protocol_dialogs.py tests/test_tk_tools.py -q
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Web unit and session tests
        run: npm test
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
  windows-package:
    name: Offline Windows package
    needs: [test, native, web]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build-only dependencies
        run: python -m pip install -e . -r desktop-build-requirements.txt
      - name: Build allowlisted unsigned portable archive
        run: python tools/build_windows.py --output dist/windows
      - name: Verify extracted executable outside checkout and without Python on PATH
        run: |
          $archive = Get-ChildItem dist/windows/PNE-Scheduler-Windows-x64-*.zip
          if ($archive.Count -ne 1) { throw "Expected one package" }
          python tools/check_windows_bundle.py $archive.FullName --reports dist/package-checks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload verified offline candidate
        uses: actions/upload-artifact@v4
        with:
          name: PNE-Scheduler-Windows-x64-${{ github.sha }}
          path: |
            dist/windows/*.zip
            dist/windows/*.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package-checks-${{ github.sha }}
          path: dist/package-checks/
          if-no-files-found: ignore
          retention-days: 30
